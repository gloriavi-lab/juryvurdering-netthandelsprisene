[theme]
# FORELØPIG verdi – jeg har IKKE tilgang til Posten Brings interne
# profilmanual, så dette er Bring sin kjente offentlige merkegrønn som
# utgangspunkt. Bekreft/korriger mot de offisielle hex-verdiene.
primaryColor = "#00703C"
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
baseRadius = "0.75rem"
# backgroundColor/textColor er bevisst IKKE satt – da bruker Streamlit sine
# innebygde lys/mørk-fargesett (styrt av brukerens system/app-innstilling),
# slik at appen fungerer fint i begge. Egendefinerte kort/klasser i styles.py
# følger samme valg via en prefers-color-scheme-regel.
